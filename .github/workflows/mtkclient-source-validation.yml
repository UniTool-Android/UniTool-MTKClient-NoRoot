name: MTKClient Android source validation

on:
  push:
    branches:
      - feature/android-arm64-standalone-runtime
  pull_request:
    branches:
      - feature/android-arm64-standalone-runtime
  workflow_dispatch:

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pyusb pycryptodome pycryptodomex colorama pyserial fusepy
      - name: Compile MTK modules
        run: |
          python -m compileall -q mtkclient
      - name: Validate CLI entry point
        run: |
          python -m mtkclient.mtk --help
          python mtk.py --help
          python -m mtkclient.usb_probe --help
      - name: Validate USB configuration and Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from mtkclient.config.usb_ids import default_ids

          files = [
              "mtkclient/Library/mtk_class.py",
              "mtkclient/Library/DA/mtk_class.py",
              "mtkclient/Library/Connection/usblib.py",
              "mtkclient/Library/Port.py",
          ]
          for filename in files:
              ast.parse(Path(filename).read_text(encoding="utf-8"), filename=filename)

          assert isinstance(default_ids, dict)
          assert default_ids[0x0E8D][0x0003] == -1
          assert default_ids[0x0E8D][0x2000] == -1
          print("Syntax and MTK VID/PID configuration checks passed.")
          PY
